<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>烬海纪元 · Ember Sea Era</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0a0a0a; overflow: hidden; height: 100%; font-family: 'Courier New', monospace; }
      #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      #hud {
        position: fixed; top: 12px; left: 12px; color: #e8c547;
        font-size: 12px; line-height: 1.6; pointer-events: none;
        text-shadow: 1px 1px 0 #000;
      }
      #hud .title { font-size: 14px; font-weight: bold; color: #ff7a3a; }
      #crosshair {
        position: fixed; pointer-events: none; width: 16px; height: 16px;
        border: 2px solid #e8c547; transform: translate(-50%, -50%);
        mix-blend-mode: difference;
      }
      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #ff7a3a; font-size: 18px; background: #0a0a0a; z-index: 100;
      }
      #loading.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="loading">渲染特恩无人区中…</div>
    <canvas id="game"></canvas>
    <div id="crosshair" hidden></div>
    <div id="hud">
      <div class="title">烬海纪元 · M0 一格破坏验证</div>
      <div id="hud-pos">坐标: (0, 0)</div>
      <div id="hud-block">方块: — (硬度 —)</div>
      <div id="hud-region">区块: —</div>
      <div style="margin-top:6px;opacity:0.7">← → 移动 | ↑/空格 跳跃 | 左键 破坏 | 右键 放置</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
